name: Java Spring Boot CI/CD Pipeline

# 1. Déclencheur : Quand ce pipeline doit-il tourner ?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build Java & Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du dépôt Git
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configurer le JDK 21 sur la machine GitHub
      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Active le cache automatique des dépendances Maven

      # 3. Compiler et executer les tests unitaires (CI)
      - name: Tests et Compilation Java
        run: mvn clean test

      # 4. Configurer Docker Buildx
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Se connecter à Docker Hub (Optionnel - pour push plus tard)
      # Pour l'instant on teste la construction de l'image en local sur la CI

      # 1. Étape de connexion sécurisée (utilise les Secrets GitHub)
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Build ET Push de l'image
      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # On utilise le secret pour le nom d'utilisateur dans le tag
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dockering:latest

